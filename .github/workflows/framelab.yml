name: framelab

on:
  push:
    branches: [main]
    paths: ["framelab/**", ".github/workflows/framelab.yml"]
  pull_request:
    paths: ["framelab/**", ".github/workflows/framelab.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framelab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: §11 acceptance suite on the pinned local stack
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: framelab
    env:
      # The published image of the pinned ethrex commit is linux/amd64, so it runs natively here.
      FRAMELAB_ETHREX_IMAGE: ghcr.io/forshtat/eip8141-devnet@sha256:c9a7770f892e02255999e1c0ffd596ecee704d9175c2480811ccdcfa1c2224c6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: scripts/setup-vendor.sh
      - run: docker pull "$FRAMELAB_ETHREX_IMAGE"
      - name: Acceptance suite
        run: scripts/acceptance.sh .runs/ci
      - name: Devnet submit path on the local stack
        if: ${{ !cancelled() }}
        run: bun src/gates/devnet-local.ts
      - name: Job summary
        if: always()
        run: |
          [ -f .runs/ci/summary.tsv ] || exit 0
          {
            echo "### FrameLab §11 acceptance"
            echo '```'
            cat .runs/ci/header.txt
            echo '```'
            echo "| check | result | seen | what |"
            echo "|---|---|---|---|"
            awk -F'\t' '{ gsub(/\|/, "\\|"); printf "| %s | %s | %s | %s |\n", $1, $2, $3, $5 }' .runs/ci/summary.tsv
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: framelab-acceptance
          if-no-files-found: ignore
          path: |
            framelab/.runs/ci/summary.tsv
            framelab/.runs/ci/header.txt
            framelab/.runs/ci/logs/
            framelab/.runs/ci/bundle-a4/
            framelab/.runs/ci/bundle-a1-s1/
      # Per-run node logs for diagnosing a failure. Engine JWTs, sidecar config (relayer key),
      # raw RPC logs and data dirs stay on the runner.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: framelab-run-logs
          if-no-files-found: ignore
          path: |
            framelab/.runs/ci/runs/**/sidecar.log
            framelab/.runs/ci/runs/**/observe.jsonl
            framelab/.runs/ci/runs/**/meta.json
            framelab/.runs/ci/runs/**/events.jsonl
            framelab/.runs/devnet-local-*/devnet.json
            !framelab/.runs/**/sidecar-data/**
