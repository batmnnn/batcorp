schema: framelab.scenario/v1
id: s1-neg-pass-timeout
description: >
  NEGATIVE PATH (acceptance test 3): S1 with a 1 ms checkpoint wait, so no completed pass is observed and every assertion must be INCONCLUSIVE, never green.
  Original S1 description follows.
  Four keyed self-pay frame txs from one EOA are admitted. A normal transfer then leaves
  the EOA above each tx's max cost but below their sum. SP-BAL-ENFORCE requires cancelling
  its newest New entries until the rest fit. An unrelated control tx must stay pending.
seed: s1-v1
rule_pack: sidecar-policy@2e22ff0
protocol_revisions:
  eip8141: forshtat/ethrex@9aa3645d795945c64400f41a70aace0edfa7f383
  policy: sidecar-policy@2e22ff0
genesis:
  sha256: 5fe93acb7674db5d809aae4d66bff742121ed718bcddd327efcb8c1a9e631fb4
  chain_id: 9
actors:
  - { role: payer, fund_wei: "10000000000000000000" }
  - { role: control, fund_wei: "1000000000000000000" }
  - { role: sink, fund_wei: "1" }
steps:
  - { id: fund, group: setup, action: fund, actors: [payer, control, sink] }
  - { id: cp-setup, group: setup, action: advance-to-checkpoint, checkpoint_id: cp-setup, depends_on: [fund] }
  - { id: submit-tx1, action: submit, tx_role: tx1, actor: payer, nonce_key: "1", to: sink, value_wei: "1", depends_on: [cp-setup] }
  - { id: submit-tx2, action: submit, tx_role: tx2, actor: payer, nonce_key: "2", to: sink, value_wei: "1", depends_on: [cp-setup] }
  - { id: submit-tx3, action: submit, tx_role: tx3, actor: payer, nonce_key: "3", to: sink, value_wei: "1", depends_on: [cp-setup] }
  - { id: submit-tx4, action: submit, tx_role: tx4, actor: payer, nonce_key: "4", to: sink, value_wei: "1", depends_on: [cp-setup] }
  - { id: submit-control, action: submit, tx_role: control, actor: control, nonce_key: "0", to: sink, value_wei: "1", depends_on: [cp-setup] }
  - id: drain
    action: transfer
    actor: payer
    to: sink
    amount: { leave_max_cost_multiple: 2.5, of_tx_role: tx1 }
    depends_on: [cp-setup]
  - { id: cp-trigger, action: advance-to-checkpoint, checkpoint_id: cp-trigger, depends_on: [drain] }
expectations:
  - assertion_id: S1-A1
    tx_role: tx1
    checkpoint_id: cp-trigger
    expected: pending
    rule_ref: SP-BAL-ENFORCE
    derivation: >
      payer funded -> tx1..tx4 admitted (oldest first), each owing max cost + 1 wei -> drain leaves
      2.5x one max cost -> newest-first cancellation stops once the rest fit -> tx1 is outside the set.
    preconditions:
      - { kind: admitted, tx_role: tx1 }
      - { kind: obligations-exceed-balance, account: payer }
      - { kind: outside-newest-cancellation-set, tx_role: tx1, account: payer }
    evidence_required: [pass-completed, status, balance, max-cost-from-el]
  - assertion_id: S1-A2
    tx_role: tx2
    checkpoint_id: cp-trigger
    expected: pending
    rule_ref: SP-BAL-ENFORCE
    derivation: as S1-A1; tx2 is the second oldest and stays outside the newest-first set.
    preconditions:
      - { kind: admitted, tx_role: tx2 }
      - { kind: obligations-exceed-balance, account: payer }
      - { kind: outside-newest-cancellation-set, tx_role: tx2, account: payer }
    evidence_required: [pass-completed, status, balance, max-cost-from-el]
  - assertion_id: S1-A3
    tx_role: tx3
    checkpoint_id: cp-trigger
    expected: evicted
    rule_ref: SP-BAL-ENFORCE
    derivation: as S1-A1; removing tx4 alone still leaves the payer short, so tx3 is cancelled too.
    preconditions:
      - { kind: admitted, tx_role: tx3 }
      - { kind: obligations-exceed-balance, account: payer }
      - { kind: in-newest-cancellation-set, tx_role: tx3, account: payer }
    evidence_required: [pass-completed, status, balance, max-cost-from-el]
  - assertion_id: S1-A4
    tx_role: tx4
    checkpoint_id: cp-trigger
    expected: evicted
    rule_ref: SP-BAL-ENFORCE
    derivation: as S1-A1; tx4 is the newest pending entry, so it is cancelled first.
    preconditions:
      - { kind: admitted, tx_role: tx4 }
      - { kind: obligations-exceed-balance, account: payer }
      - { kind: in-newest-cancellation-set, tx_role: tx4, account: payer }
    evidence_required: [pass-completed, status, balance, max-cost-from-el]
  - assertion_id: S1-A5
    tx_role: control
    checkpoint_id: cp-trigger
    expected: pending
    rule_ref: SP-BAL-ENFORCE
    derivation: control owes nothing to payer and its own balance is untouched, so no rule removes it.
    preconditions:
      - { kind: admitted, tx_role: control }
      - { kind: no-obligation-to, tx_role: control, account: payer }
    evidence_required: [pass-completed, status]
limits:
  checkpoint_wait_ms: 1
  scenario_ms: 180000
  shrink_candidates: 40
  shrink_wall_ms: 1800000
