<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrameLab · your own VM</title>
<style>
/* Same "Notebook" palette and unslop rules as viewer/index.html (unslop by Damir Sokolovsky, CC BY 4.0). */
:root {
  color-scheme: dark;
  --page: #1e201e;
  --raised: #3c3d37;
  --card: color-mix(in srgb, #1e201e 68%, #3c3d37);
  --well: color-mix(in srgb, #1e201e 82%, #000);
  --text: #ecdfcc;
  --text-2: color-mix(in srgb, #ecdfcc 78%, #1e201e);
  --text-3: color-mix(in srgb, #ecdfcc 60%, #1e201e);
  --line: color-mix(in srgb, #ecdfcc 9%, transparent);
  --line-2: color-mix(in srgb, #ecdfcc 15%, transparent);
  --accent: #86bcbd;
  --pass: #a4ce8b;
  --fail: #d37676;
  --warn: #dbcc95;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-btn: 8px; --r-card: 12px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --t: 160ms;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; background: var(--page); color: var(--text); font: 400 14px/1.5 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-weight: 500; line-height: 1.3; text-wrap: balance; }
h2 { font-size: 20px; }
h3 { font-size: 15px; }
p { margin: 8px 0; max-width: 68ch; text-wrap: pretty; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); }
a:hover { text-decoration-color: currentColor; }
code { font: 12px var(--mono); font-variant-ligatures: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: 12px; }
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--page) 80%, transparent); -webkit-backdrop-filter: saturate(1.8) blur(20px); backdrop-filter: saturate(1.8) blur(20px); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 880px; margin: 0 auto; height: 52px; padding: 0 24px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 15px; color: var(--text); text-decoration: none; }
.brand svg { width: 18px; height: 18px; color: var(--text-2); }
.ctx { color: var(--text-3); font: 12px var(--mono); }
.spacer { flex: 1; }
main { max-width: 880px; margin: 0 auto; padding: 24px 24px 64px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 20px; }
.kicker { font-size: 12px; color: var(--text-3); }
.lede { color: var(--text-2); font-size: 15px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 20px; }
.facts-line { margin-top: 16px; font-size: 12px; color: var(--text-3); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: var(--r-btn); border: 1px solid var(--line-2); background: transparent; color: var(--text); font: 500 13px var(--sans); cursor: pointer; white-space: nowrap; text-decoration: none; transition: background-color var(--t) var(--ease); }
.btn:hover:not(:disabled) { background: var(--line); }
.btn.primary { background: var(--text); color: var(--page); border-color: transparent; }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--text) 86%, var(--page)); }
.btn.ghost { border-color: transparent; color: var(--text-2); }
.btn.lg { height: 36px; padding: 0 16px; font-size: 14px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
.state { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.state h2 { font-size: 22px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--text-3); }
.dot.live { background: var(--accent); }
.dot.ok { background: var(--pass); }
.dot.bad { background: var(--fail); }
@media (prefers-reduced-motion: no-preference) { .dot.live { animation: breathe 1.6s var(--ease) infinite; } }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.note { margin-top: 16px; padding: 12px 14px; border-radius: var(--r-btn); border: 1px solid var(--line); color: var(--text-2); }
.note.bad { border-color: color-mix(in srgb, var(--fail) 40%, transparent); color: var(--text); }
.steps { margin: 16px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; }
.steps > li > .muted { margin: 0 0 6px; }
.cmd { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; background: var(--well); border: 1px solid var(--line); border-radius: var(--r-btn); }
.cmd code { flex: 1; overflow-wrap: anywhere; color: var(--text); }
.cmd code .c { color: var(--text-3); }
.copy { height: 26px; padding: 0 8px; font-size: 12px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin-top: 16px; font-size: 13px; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; font-family: var(--mono); font-size: 12px; }
@media (max-width: 560px) { .top-inner, main { padding-left: 16px; padding-right: 16px; } .ctx { display: none; } }
</style>
</head>
<body>
<header class="top"><div class="top-inner">
  <a class="brand" id="brand" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M4 12h16M4 17h7"/><circle cx="17" cy="7" r="2"/><circle cx="14" cy="17" r="2"/></svg>FrameLab</a>
  <span class="ctx">your own VM</span>
  <span class="spacer"></span>
  <span id="who" class="small faint"></span>
</div></header>
<main id="main" aria-live="polite"><section class="card"><p class="muted">Loading…</p></section></main>
<script>
"use strict";
const ERRORS = { state: "That sign-in attempt expired. Connect GitHub again.", github: "GitHub sign-in did not complete. Try again.", unconfigured: "GitHub sign-in is not switched on yet." };
const STATES = {
  creating: ["live", "Creating your VM", "Azure is starting it. This takes about a minute."],
  "setting-up": ["live", "Setting up", "Docker, Bun and FrameLab are installing, then a warm-up replay runs. About 10 minutes. You can SSH in now and run framelab-status to watch."],
  ready: ["ok", "Ready", "FrameLab is set up and its warm-up replay passed."],
  failed: ["bad", "Setup failed", "SSH in and read ~/framelab-setup.log, or delete this VM and start a new one."],
  deleting: ["", "Deleting", "Your VM is being deleted."],
};
let me = null, timer = null, busy = false, flash = null;
const err = new URLSearchParams(location.search).get("error");
if (err && ERRORS[err]) flash = ERRORS[err];
if (err) history.replaceState(null, "", "/");

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
function cmd(text, comment) {
  const btn = h("button", { class: "btn copy", type: "button", onclick: async () => {
    try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 1500); } catch { btn.textContent = "Select it"; }
  } }, "Copy");
  return h("div", { class: "cmd" }, h("code", null, text, comment ? h("span", { class: "c" }, `   # ${comment}`) : null), btn);
}
const left = (iso) => {
  const m = Math.max(0, Math.round((Date.parse(iso) - Date.now()) / 60000));
  return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`;
};
const utc = (iso) => `${iso.slice(11, 16)} UTC`;

async function post(path) {
  const res = await fetch(path, { method: "POST", headers: { "x-framelab": "1" } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}
async function act(path, confirmText) {
  if (busy || (confirmText && !confirm(confirmText))) return;
  busy = true; flash = null; render();
  try { await post(path); } catch (e) { flash = e.message; }
  busy = false;
  await load();
}

function signedOut() {
  const l = me.limits;
  return h("section", { class: "card" },
    h("span", { class: "kicker" }, "Run it yourself"),
    h("div", { class: "state" }, h("h2", null, "Your own FrameLab VM")),
    h("p", { class: "lede" }, `Connect GitHub to get a fresh Linux VM with FrameLab already set up. You log in with the SSH keys on your GitHub account, run the release checks yourself, and the VM is deleted after ${l.lifetimeMinutes / 60} hours.`),
    flash ? h("div", { class: "note bad" }, flash) : !me.signInReady ? h("div", { class: "note" }, ERRORS.unconfigured) : null,
    h("div", { class: "actions" }, me.signInReady
      ? h("a", { class: "btn primary lg", href: "/auth/login" }, "Connect GitHub")
      : h("button", { class: "btn primary lg", type: "button", disabled: true }, "Connect GitHub")),
    h("p", { class: "facts-line" }, `4 vCPU · 16 GB · deleted after ${l.lifetimeMinutes / 60} hours · ${me.capacity.running} of ${me.capacity.max} in use · GitHub shares only your public profile`),
    h("p", { class: "small faint" }, "Rather not sign in? The published results are at ", h("a", { href: me.viewer }, new URL(me.viewer).host), ", and the README shows how to run FrameLab on your own machine."));
}

function noVm() {
  const why = me.refusal;
  return h("section", { class: "card" },
    h("span", { class: "kicker" }, `Signed in as @${me.login}`),
    h("div", { class: "state" }, h("h2", null, "Start your VM")),
    h("p", { class: "lede" }, `A fresh Linux VM that trusts the SSH keys on github.com/${me.login}.keys and nothing else. Setup takes about 10 minutes; the VM is deleted after ${me.limits.lifetimeMinutes / 60} hours.`),
    flash ? h("div", { class: "note bad" }, flash) : why ? h("div", { class: "note" }, why.message) : null,
    h("div", { class: "actions" },
      h("button", { class: "btn primary lg", type: "button", disabled: busy || !!why, onclick: () => act("/api/vm") }, busy ? "Starting…" : "Start my VM")),
    h("p", { class: "facts-line" }, `${me.capacity.running} of ${me.capacity.max} VMs in use · ${me.limits.perAccountPerDay} per GitHub account per day · only TCP 80 and 443 go out from the VM`));
}

function haveVm() {
  const vm = me.vm;
  const [tone, title, text] = STATES[vm.state] || ["", vm.state, ""];
  const ip = vm.ip || "…";
  const up = vm.state === "setting-up" || vm.state === "ready" || vm.state === "failed";
  return [
    h("section", { class: "card" },
      h("span", { class: "kicker" }, `Signed in as @${me.login}`),
      h("div", { class: "state" }, h("span", { class: `dot ${tone}` }), h("h2", null, title)),
      h("p", { class: "lede" }, text),
      flash ? h("div", { class: "note bad" }, flash) : null,
      h("dl", { class: "kv" },
        h("dt", null, "Address"), h("dd", null, ip),
        h("dt", null, "Deleted at"), h("dd", null, `${utc(vm.expiresAt)}, in ${left(vm.expiresAt)}`),
        h("dt", null, "Name"), h("dd", null, vm.name)),
      h("div", { class: "actions" },
        vm.state === "ready" && vm.ui
          ? h("a", { class: "btn primary lg", href: "/ui/", target: "_blank", rel: "noopener" }, "Open FrameLab")
          : h("button", { class: "btn primary lg", type: "button", disabled: true }, vm.state === "ready" ? "Connecting the UI…" : "Open FrameLab"),
        h("button", { class: "btn ghost", type: "button", disabled: busy || vm.state === "deleting", onclick: () => act("/api/vm/delete", "Delete your VM now? Anything on it is lost.") }, "Delete my VM now")),
      vm.state === "ready" || vm.state === "setting-up" ? h("p", { class: "facts-line" }, "Open FrameLab runs the same UI as on your own machine, live on this VM: start the local network, run scenarios, shrink a failure and export the bundle.") : null),
    up ? h("section", { class: "card" },
      h("h3", null, "Or use a terminal"),
      h("ol", { class: "steps" },
        h("li", null, h("p", { class: "muted small" }, "Log in. SSH asks you to trust the VM's host key the first time."), cmd(`ssh judge@${ip}`)),
        vm.state !== "ready" ? h("li", null, h("p", { class: "muted small" }, "On the VM, wait for setup to finish:"), cmd("framelab-status")) : null,
        h("li", null, h("p", { class: "muted small" }, "Replay the two published bundles. Each is a fresh run on a new local chain, not a playback:"),
          cmd("cd ~/batcorp/framelab"),
          h("div", { style: "height:6px" }),
          cmd("FRAMELAB=$PWD evidence/v0.1-rc/injected-s1-reduced/replay.sh", "exit 1, as recorded"),
          h("div", { style: "height:6px" }),
          cmd("FRAMELAB=$PWD evidence/v0.1-rc/s1-pass/replay.sh", "exit 0")),
        h("li", null, h("p", { class: "muted small" }, "The UI also answers through an SSH tunnel: connect like this, then open http://127.0.0.1:4173 on your machine."),
          cmd(`ssh -L 4173:127.0.0.1:4173 judge@${ip}`))),
      h("p", { class: "facts-line" }, "Exit codes: 0 a clean pass, 1 a confirmed mismatch, 2 anything incomplete. The injected bug is a local test patch, not an upstream bug.")) : null,
  ];
}

function render() {
  const main = document.getElementById("main");
  const who = document.getElementById("who");
  who.replaceChildren();
  if (!me) return;
  if (me.signedIn) who.append(h("button", { class: "btn ghost copy", type: "button", onclick: async () => { await post("/auth/logout").catch(() => {}); await load(); } }, `@${me.login} · Sign out`));
  main.replaceChildren(...[!me.signedIn ? signedOut() : me.vm ? haveVm() : noVm()].flat().filter(Boolean));
}

async function load() {
  clearTimeout(timer);
  try {
    const res = await fetch("/api/me", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    me = await res.json();
  } catch {
    if (!me) document.getElementById("main").replaceChildren(h("section", { class: "card" }, h("p", { class: "muted" }, "The lab is not answering. Try again in a minute.")));
  }
  render();
  const fast = me && me.vm && (["creating", "setting-up", "deleting"].includes(me.vm.state) || !me.vm.ui);
  timer = setTimeout(load, fast ? 10000 : 60000);
}
load();
</script>
</body>
</html>
