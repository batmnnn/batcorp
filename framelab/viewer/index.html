<title>FrameLab</title>
<style>
/* Palette "Notebook", from Color Hunt: base colorhunt.co/palette/1e201e3c3d37697565ecdfcc,
   status from colorhunt.co/palette/ba5a5af7e49ba4ce8b86bcbd, …/c3e2c2eaecccdbcc95cd8d7a, …/b0c5a4d37676ebc49ff1ef99.
   Design rules follow unslop by Damir Sokolovsky (github.com/heydamir/unslop), CC BY 4.0. */
:root {
  color-scheme: dark;
  --page: #1e201e;
  --raised: #3c3d37;
  --card: color-mix(in srgb, #1e201e 68%, #3c3d37);
  --well: color-mix(in srgb, #1e201e 82%, #000);
  --text: #ecdfcc;
  --text-2: color-mix(in srgb, #ecdfcc 78%, #1e201e);
  --text-3: color-mix(in srgb, #ecdfcc 60%, #1e201e);
  --sage: #697565;
  --line: color-mix(in srgb, #ecdfcc 9%, transparent);
  --line-2: color-mix(in srgb, #ecdfcc 15%, transparent);
  --accent: #86bcbd;
  --pass: #a4ce8b;
  --fail: #d37676;
  --warn: #dbcc95;
  --tint-accent: color-mix(in srgb, #86bcbd 11%, transparent);
  --tint-fail: color-mix(in srgb, #d37676 9%, transparent);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-tag: 6px; --r-btn: 8px; --r-card: 12px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --t: 160ms;
}

/* ============ base ============ */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 112px; scrollbar-color: var(--line-2) transparent; }
body {
  margin: 0; min-height: 100dvh; background: var(--page); color: var(--text);
  font: 400 14px/1.5 var(--sans); font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); }
h1, h2, h3, h4 { margin: 0; font-weight: 500; line-height: 1.3; text-wrap: balance; }
h2 { font-size: 20px; }
h3 { font-size: 16px; }
h4 { font-size: 13px; color: var(--text-2); margin: 20px 0 8px; }
p { margin: 8px 0; max-width: 72ch; text-wrap: pretty; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); transition: text-decoration-color var(--t) var(--ease); }
a:hover { text-decoration-color: currentColor; }
a .ic { width: 12px; height: 12px; margin-left: 4px; vertical-align: -1px; }
code, .mono, pre, kbd { font-family: var(--mono); font-variant-ligatures: none; }
.mono { font-size: 13px; }
code { font-size: 12px; padding: 1px 4px; border-radius: 4px; background: var(--line); color: var(--text); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.row.tight { gap: 4px 8px; }
.spacer { flex: 1; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.tone-pass { color: var(--pass); }
.tone-fail { color: var(--fail); }
.tone-warn { color: var(--warn); }
.tone-inc { color: var(--text-3); }
.tone-accent { color: var(--accent); }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; flex: none; }
@media (prefers-reduced-motion: no-preference) {
  .live-dot { animation: breathe 1.6s var(--ease) infinite; animation-delay: var(--ph, 0ms); }
}
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

/* ============ top bar: the one glass layer, over content that scrolls under it ============ */
.top {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--page) 80%, transparent);
  -webkit-backdrop-filter: saturate(1.8) blur(20px); backdrop-filter: saturate(1.8) blur(20px);
  border-bottom: 1px solid var(--line);
}
.top-inner { max-width: 1200px; margin: 0 auto; height: 52px; padding: 0 24px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand .mark { width: 18px; height: 18px; color: var(--text-2); }
.brand-name { font-weight: 500; font-size: 15px; white-space: nowrap; }
.ctx { margin-left: 8px; color: var(--text-3); font: 12px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.conn { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--mono); color: var(--text-3); white-space: nowrap; }
.conn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pass); }
.conn.lost .dot { background: var(--fail); }
.conn.lost { color: var(--fail); }
.conn.file .dot { background: var(--text-3); }

.states-pop { position: relative; }
.states-pop > summary {
  list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 10px;
  border-radius: var(--r-btn); border: 1px solid var(--line); font-size: 13px; white-space: nowrap;
  transition: background-color var(--t) var(--ease);
}
.states-pop > summary::-webkit-details-marker { display: none; }
.states-pop > summary:hover { background: var(--line); }
.states-pop > summary > .ic:last-child { width: 12px; height: 12px; color: var(--text-3); transform: rotate(90deg); transition: transform var(--t) var(--ease); }
.states-pop[open] > summary > .ic:last-child { transform: rotate(-90deg); }
.status.tone-pass > :first-child { color: var(--pass); }
.status.tone-fail > :first-child { color: var(--fail); }
.status.tone-inc > :first-child { color: var(--text-3); }
.status.tone-accent > :first-child { color: var(--accent); }
.status { color: var(--text); }
.pop {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 50; width: 280px; padding: 12px 16px;
  border-radius: var(--r-card); border: 1px solid var(--line-2);
  background: color-mix(in srgb, var(--raised) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.8) blur(24px); backdrop-filter: saturate(1.8) blur(24px);
}
.pop p { margin: 0 0 8px; }
.pop ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.pop li { display: flex; align-items: center; gap: 8px; color: var(--text-2); }
.pop li .dotk { width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); flex: none; }
.pop li[aria-current] { color: var(--text); }
.pop li[aria-current] .dotk { background: var(--accent); }
.pop li.unbuilt { color: var(--text-3); }
.pop li.unbuilt .dotk { background: transparent; box-shadow: inset 0 0 0 1px var(--text-3); }

/* ============ the six stages, in the glass bar ============ */
.track-wrap { position: relative; overflow-x: auto; scrollbar-width: none; }
.track-wrap::-webkit-scrollbar { display: none; }
.track { list-style: none; max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 40px; display: flex; align-items: stretch; gap: 20px; }
.stage { display: flex; }
.stage .in { display: flex; align-items: center; gap: 6px; color: var(--text-3); text-decoration: none; font-size: 13px; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color var(--t) var(--ease); }
a.in:hover { color: var(--text); }
.stage .g { display: inline-grid; place-items: center; width: 16px; height: 16px; }
.stage .g .ic { width: 14px; height: 14px; }
.st-todo .g, .st-skip .g { color: var(--text-3); opacity: 0.7; }
.st-done .in, .st-pass .in, .st-fail .in, .st-inc .in, .st-warn .in, .st-next .in, .st-open .in, .st-live .in { color: var(--text-2); }
.st-done .g, .st-inc .g { color: var(--text-3); }
.st-pass .g { color: var(--pass); }
.st-fail .g { color: var(--fail); }
.st-warn .g { color: var(--warn); }
.st-next .g, .st-open .g { color: var(--accent); }
.stage[aria-current] .in { color: var(--text); border-bottom-color: var(--accent); }
.sum-now { margin-left: auto; align-self: center; color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 42%; }

/* ============ layout ============ */
main { max-width: 1200px; margin: 0 auto; padding: 24px 24px 64px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 20px; min-width: 0; }
.head { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; min-height: 32px; }
.head .lead { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.head .lead h2.mono { font-size: 18px; }
.title-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.title-row > span:first-child .ic { width: 24px; height: 24px; }
.title-row .live-dot { width: 10px; height: 10px; margin: 0 7px; }
.head .title-row { margin-top: 0; }
.lede { color: var(--text-2); font-size: 15px; }
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 20px; }
.facts-line { margin-top: 16px; font-size: 12px; color: var(--text-3); }
.field-k { font-size: 12px; color: var(--text-3); margin: 20px 0 8px; }
.empty-note { display: flex; gap: 12px; align-items: flex-start; color: var(--text-2); padding: 12px 0; }
.empty-note .ic { color: var(--text-3); margin-top: 2px; }
.empty-note p { margin: 4px 0 0; }
.empty-note b { font-weight: 500; }

/* ============ controls ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 12px;
  border-radius: var(--r-btn); border: 1px solid var(--line-2); background: transparent; color: var(--text);
  font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; user-select: none;
  transition: background-color var(--t) var(--ease), border-color var(--t) var(--ease), color var(--t) var(--ease);
}
.btn:hover:not(:disabled) { background: var(--line); }
.btn.primary { background: var(--text); color: var(--page); border-color: transparent; }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--text) 86%, var(--page)); }
.btn.ghost { border-color: transparent; color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { color: var(--text); }
.btn.lg { height: 36px; padding: 0 16px; font-size: 14px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
kbd { font-size: 11px; line-height: 16px; padding: 0 4px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--text-3); }
.icon-btn { width: 24px; height: 24px; display: inline-grid; place-items: center; flex: none; border: 0; border-radius: 6px; background: transparent; color: var(--text-3); cursor: pointer; transition: background-color var(--t) var(--ease), color var(--t) var(--ease); }
.icon-btn:hover { background: var(--line); color: var(--text); }
.icon-btn .ic { width: 14px; height: 14px; }
.icon-btn.done { color: var(--pass); }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-size: 13px; cursor: pointer; }

.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--r-btn); border: 1px solid var(--line); }
.seg button { height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--text-2); font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background-color var(--t) var(--ease), color var(--t) var(--ease); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"], .seg button[aria-checked="true"] { background: var(--raised); color: var(--text); }
.seg .count { color: var(--text-3); }
.seg.lg { display: flex; }
.seg.lg button { flex: 1; height: 32px; font: 13px var(--mono); }
.seg.lg button.inj .ic { width: 14px; height: 14px; color: var(--warn); }

.choices { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-btn); overflow: hidden; }
.choice { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-top: 1px solid var(--line); cursor: pointer; font: 13px var(--mono); transition: background-color var(--t) var(--ease); }
.choice:first-child { border-top: 0; }
.choice:hover { background: var(--line); }
.choice input { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; margin: 0; border-radius: 50%; border: 1.5px solid var(--text-3); display: grid; place-items: center; flex: none; cursor: pointer; }
.choice input:checked { border-color: var(--accent); }
.choice input:checked::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.choice:has(input:checked) { background: var(--tint-accent); }

/* ============ status, tags, banners ============ */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.st.s-pass .ic { color: var(--pass); }
.st.s-fail .ic { color: var(--fail); }
.st.s-inc .ic { color: var(--text-3); }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: var(--r-tag); border: 1px solid var(--line-2); color: var(--text-2); white-space: nowrap; font-family: var(--sans); }
.tag .ic { width: 14px; height: 14px; }
.tag.t-warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.banner { display: flex; align-items: flex-start; gap: 8px; margin: 12px 0 0; padding: 8px 12px; border-radius: var(--r-btn); border: 1px solid var(--line); font-size: 13px; color: var(--text-2); }
.banner > .ic { margin-top: 2px; color: var(--text-3); }
.banner > div { flex: 1; min-width: 0; }
.banner.red { border-color: color-mix(in srgb, var(--fail) 35%, transparent); color: var(--text); }
.banner.red > .ic { color: var(--fail); }
.banner.amber { border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.banner.amber > .ic { color: var(--warn); }
.banner.blue > .ic { color: var(--accent); }
main > .banner { margin: 0; }

/* ============ disclosure, key-value, code ============ */
details.disclose { border-top: 1px solid var(--line); margin-top: 16px; }
details.disclose > summary { display: flex; align-items: center; gap: 8px; min-height: 40px; list-style: none; cursor: pointer; font-size: 13px; color: var(--text-2); transition: color var(--t) var(--ease); }
details.disclose > summary::-webkit-details-marker { display: none; }
details.disclose > summary::before { content: ""; width: 6px; height: 6px; flex: none; margin: 0 4px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform var(--t) var(--ease); }
details.disclose[open] > summary::before { transform: rotate(45deg) translate(-1px, -1px); }
details.disclose > summary:hover { color: var(--text); }
details.disclose > summary h3 { color: var(--text); font-size: 15px; }
.card > details.disclose:first-child { border-top: 0; margin-top: 0; }
.card > details.disclose:last-child { margin-bottom: -8px; }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; margin: 12px 0 0; font-size: 13px; }
dl.kv dt { color: var(--text-3); }
dl.kv dd { margin: 0; display: flex; align-items: center; gap: 4px; min-width: 0; }
dl.kv dd .v { overflow-wrap: anywhere; }
dl.kv .mono { font-size: 12px; }
pre { margin: 8px 0; padding: 12px; border-radius: var(--r-btn); background: var(--well); border: 1px solid var(--line); font-size: 12px; line-height: 1.6; color: var(--text-2); overflow: auto; max-height: 360px; tab-size: 2; }
pre.log { max-height: 280px; }
.cmd { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 12px; background: var(--well); border: 1px solid var(--line); border-radius: var(--r-btn); }
.cmd code { background: none; padding: 0; flex: 1; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; }
.chip { font: 12px var(--mono); line-height: 20px; padding: 0 6px; border-radius: var(--r-tag); border: 1px solid var(--line-2); color: var(--text-2); }
.chip.removed { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--text-3); }
ul.facts { margin: 8px 0; padding-left: 16px; font-size: 13px; color: var(--text-2); }
ul.facts li { margin: 4px 0; overflow-wrap: anywhere; }
ul.checks { list-style: none; margin: 8px 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
ul.checks li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; }
ul.checks li > span:last-child { display: flex; flex-direction: column; min-width: 0; }
ul.checks b { font-weight: 400; font-size: 12px; }
.ck { color: var(--text-3); display: inline-grid; padding-top: 2px; }
.ck.ok { color: var(--pass); }
.ck.no { color: var(--fail); }
.ck.unk { color: var(--warn); }

/* ============ saved results ============ */
.list { margin: 12px -20px 0; border-top: 1px solid var(--line); }
.list-k { margin: 20px 0 0; font-size: 12px; color: var(--text-2); }
.grow {
  display: grid; grid-template-columns: 120px minmax(0, 1fr) auto 72px 48px 16px; gap: 12px; align-items: center; width: 100%;
  padding: 8px 20px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--text); text-align: left; cursor: pointer;
  transition: background-color var(--t) var(--ease);
}
.grow:last-child { border-bottom: 0; }
.grow:hover { background: var(--line); }
.grow.flat { grid-template-columns: 120px minmax(0, 1fr) 72px 48px 16px; }
.grow .name { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-width: 0; }
.grow .nm { font: 13px var(--mono); }
.grow .path { flex-basis: 100%; font: 12px var(--mono); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow .when, .grow .kind { font-size: 12px; color: var(--text-3); text-align: right; }
.grow .kind { text-align: left; }
.grow .chev { color: var(--text-3); display: inline-grid; }
.hist { display: flex; align-items: center; gap: 4px; }
.hist i { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
.hist i.h-pass { background: var(--pass); }
.hist i.h-fail { background: var(--fail); }
.hist i.h-inc { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-3); }
.results-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 4px 0 0; }
details.disclose .list { margin-left: 0; margin-right: 0; border: 1px solid var(--line); border-radius: var(--r-btn); overflow: hidden; }
details.disclose .grow { padding: 8px 12px; }

/* ============ target ============ */
.checkrow { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.checkrows { margin-top: 16px; border-bottom: 1px solid var(--line); }
.checkrow > span:first-child { padding-top: 2px; display: inline-grid; }
.checkrow .ct { display: flex; flex-direction: column; }
.checkrow .s { font: 12px var(--mono); color: var(--text-3); }
.checkrow .n { font-size: 14px; }

/* ============ running ============ */
.clock { font: 500 20px var(--mono); color: var(--text); }
.rails { display: grid; grid-template-columns: 56px minmax(0, 1fr) minmax(96px, auto); gap: 12px 16px; align-items: center; margin-top: 20px; }
.rail-k { font-size: 13px; color: var(--text-2); }
.rail { position: relative; display: flex; justify-content: space-between; align-items: center; height: 16px; }
.rail::before { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 1px; background: var(--line-2); }
.rail i { position: relative; width: 12px; height: 12px; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--text-3); }
.rail i.d-done { background: var(--text-2); box-shadow: none; }
.rail i.d-live, .rail i.d-wait { background: var(--card); box-shadow: inset 0 0 0 2px var(--accent); }

// ---------- server API ----------
async function api(method, url, body) {
  const res = await fetch(url, { method, headers: method === "POST" ? { "content-type": "application/json", "x-framelab": "1" } : {}, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText}`);

}
async function act(name, fn) {

// ---------- model ----------
function buildModel(files, dir, kind) {
  const j = (n) => (files[n] ? JSON.parse(files[n]) : null);

  const runs = [1, 2]
    .map((k) => ({ k, events: jsonl(files[`events.run${k}.jsonl`]), evidence: j(`evidence.run${k}.json`), meta: j(`meta.run${k}.json`), verdict: (verdicts.runs || []).find((r) => r.run === k) || null }))
    .filter((r) => r.verdict || r.events.length);
  const reduction = j("reduction.json");

}

function setView(model) {

}
function mapName(p) {
  const direct = ["verdicts.json", "manifest.json", "reduction.json", "node_pin.json", "compare.json", "scenario.original.yaml", "scenario.min.yaml", "README.md", "rule_pack.json", "events.run1.jsonl", "events.run2.jsonl"];
  if (direct.includes(p)) return p;
  let m = p.match(/^evidence\/run(\d)\.(evidence|meta)\.json$/); if (m) return `${m[2]}.run${m[1]}.json`;
  m = p.match(/^run(\d)\/(evidence|meta)\.json$/); if (m) return `${m[2]}.run${m[1]}.json`;
  m = p.match(/^run(\d)\/events\.jsonl$/); if (m) return `events.run${m[1]}.jsonl`;

}
async function openFolder(list) {
  const files = {};

    const parts = (f.webkitRelativePath || f.name).split("/");
    top = parts.shift() || top;

function columnsOf(run) { return run.events.filter((e) => e.kind === "step-start").map((e) => ({ id: e.step_id, step: e.raw })); }
function rolesOf(cols) { return cols.filter((c) => c.step.action === "submit").map((c) => c.step.tx_role); }

  const s = col.step;
  if (s.action === "submit" && s.tx_role === role) {
    const e = run.events.find((x) => (x.kind === "admitted" || x.kind === "rejected") && x.tx_role === role);
    return { kind: "submit", fate: e ? e.kind : "not admitted", event: e, sim: run.events.find((x) => x.kind === "simulate" && x.tx_role === role) };
  }
  if (s.action !== "advance-to-checkpoint") return null;
  const a = assertionAt(run, role, s.checkpoint_id);
  const cp = run.evidence?.checkpoints?.[s.checkpoint_id];
  if (!cp) return a ? { kind: "checkpoint", fate: "not reached", assertion: a } : null;
  const tx = cp.txs?.[role];
  if (!tx) return a ? { kind: "checkpoint", fate: "not submitted", cp, assertion: a } : null;

  if (!pick) return null;
  const ci = cols.findIndex((c) => c.step.action === "advance-to-checkpoint" && c.step.checkpoint_id === pick.checkpoint_id);
  return ci < 0 ? null : { role: pick.tx_role, col: ci };

/** What each of the two fresh runs has done so far, read from the job's progress stream. */
function runProgress(p) {
  const total = last(p, (e) => e.kind === "step" && e.run <= 2)?.total ?? 0;
  const steps = [];
  const by = { 1: { steps: [] }, 2: { steps: [] } };
  for (const e of p) {
    const b = by[e.run];
    if (!b) continue;
    if (e.kind === "run-start") b.start = e;
    else if (e.kind === "reset") b.reset = e;
    else if (e.kind === "step") { b.cur = e.index; b.steps[e.index] = { ev: e }; steps[e.index] ??= { id: e.step_id, action: e.action }; }
    else if (e.kind === "checkpoint-wait" && b.steps[b.cur]) b.steps[b.cur].wait = e;
    else if (e.kind === "pass" && b.steps[b.cur]) b.steps[b.cur].pass = e;
    else if (e.kind === "run-done") b.done = e;
  }
  for (const b of Object.values(by)) {
    const cur = b.steps[b.cur];
    b.judging = Boolean(!b.done && cur && b.cur === total - 1 && (cur.ev.action !== "advance-to-checkpoint" || cur.pass));
    b.completed = b.done ? total : b.cur === undefined ? 0 : b.cur + (b.judging ? 1 : 0);
  }
  const runNo = last(p, (e) => e.kind === "run-start" && e.run <= 2)?.run ?? 1;
  return { total, steps, by, runNo, frac: total ? (by[1].completed + by[2].completed) / (2 * total) : 0 };
}

// ---------- the process: spec §6, six stages every check goes through ----------
const STAGES = [
  ["target", "Target", "Pins, rule-pack quotes and node capabilities, checked first"],
  ["scenario", "Scenario", "A scenario file and a node build"],
  ["runs", "Run ×2", "Two fresh stacks; a failure must repeat"],
  ["verdict", "Verdict", "Expected against observed, at each checkpoint"],
  ["shrink", "Shrink", "Cut a reproducible failure down"],
  ["export", "Export", "A bundle that replays from a clean start"],
];
const STATUS_SR = { done: "done", pass: "passed", fail: "failed", inc: "inconclusive", warn: "needs attention", live: "in progress", next: "next step", open: "available", todo: "not started", skip: "not needed" };
const clientShort = (v) => { const m = String(v || "").match(/^ethrex\/(v\d[\w.]*?)(?=-|\/|$)/); return m ? `ethrex ${m[1]}` : "ethrex"; };
const capOk = (v) => String(v).startsWith("ok");
function targetLine(info) {
  const caps = Object.values(info.capabilities);
  return `${clientShort(info.pins.ethrex.client_version)} · ${info.rule_pack.quotes_verified}/${info.rule_pack.quotes} quotes · ${caps.filter(capOk).length}/${caps.length} checks`;
}
const targetOk = (info) => info.rule_pack.quotes_verified === info.rule_pack.quotes && Object.values(info.capabilities).every(capOk);

/** Facts about an opened result, shared by the summary card and the process track. */
function resultFacts(m) {
  const v = m.verdicts;
  const patches = (v.sidecar_build?.patches || []).map((p) => p.file);
  const injected = m.manifest?.injected_regression || (patches.some((f) => f.split("/").pop().startsWith("inject-")) ? { label: v.sidecar_build.label, patch: patches.find((f) => f.includes("inject-")) } : null);
  const r1 = m.runs[0]?.verdict;
  const reached = m.runs.length ? Math.min(...m.runs.map((r) => r.verdict?.counts.executed ?? 0)) : 0;
  const declared = r1?.counts.declared ?? 0;
  const rules = [...new Set((r1?.assertions || []).filter((a) => a.verdict !== "INCONCLUSIVE").map((a) => a.rule_ref))];
  const first = r1?.assertions.find((a) => MISMATCH.includes(a.verdict));
  const reproducible = v.overall === "FAIL" && !(v.disagreements || []).length && m.runs.length === 2 && m.runs.every((r) => r.verdict?.overall === "FAIL");
  const canAct = ui.mode === "server" && !m.dir.includes("(local folder)");
  const canExport = canAct && m.kind !== "bundle" && !v.fault && !v.run2_sidecar_build && !v.cancelled;
  const na = Boolean(v.compatibility && !v.compatibility.applicable);
  return { v, injected, reached, declared, rules, first, reproducible, canAct, canExport, na, facts: v.overall === "INCONCLUSIVE" ? missingFacts(m) : [] };
}

/** Status and a one-line, real summary for each of the six stages, in the current state. */
function stageModel(state) {
  const S = Object.fromEntries(STAGES.map(([id, name, about]) => [id, { id, name, status: "todo", sum: about, p: 0, href: null, current: false }]));
  const set = (id, status, sum, extra) => Object.assign(S[id], { status }, sum ? { sum } : null, extra || null);
  const s = ui.server, env = s?.env, job = s?.job;
  let cur;
  if (state === "empty") {
    cur = "target";
    if (ui.mode === "file") set("target", "next", "Read-only page: open a saved bundle");
    else if (ui.mode === "hosted") set("target", "next", "Published bundles: open one to read its verdict");
    else if (env?.status === "starting" || ui.pending === "env") set("target", "live", "Starting the pinned stack on 127.0.0.1", { p: null });
    else if (env?.status === "stopped" && env.exit_code !== 0) set("target", "fail", `The local network stopped (exit ${env.exit_code})`);
    else set("target", "next", "Start the local network to check the pins");
  } else if (state === "ready") {
    cur = "scenario";
    set("target", targetOk(env.info) ? "done" : "warn", targetLine(env.info), { href: "#stage-target" });
    set("scenario", "next", "Choose a scenario and a node build, then run");
  } else if (state === "running" || state === "shrinking") {
    const p = job.progress;
    const start = p.find((e) => e.kind === "start");
    set("target", "done", ui.lastEnv ? targetLine(ui.lastEnv) : "Pinned stack, fresh for every run");
    set("scenario", "done", start ? `${start.scenario} · ${start.build}` : job.label);
    if (job.kind === "shrink") {
      cur = "shrink";
      const ss = p.find((e) => e.kind === "shrink-start");
      if (ss) {
        const t = last(p, (e) => e.kind === "candidate")?.totals;
        set("runs", "done", "The original failure repeated on both runs");
        set("verdict", "fail", `${ss.target.assertion_id} ${word(ss.target.verdict).toLowerCase()}`);
        set("shrink", "live", `${t?.kept ?? 0} kept · ${t?.node_tested ?? 0}/${ss.candidates_limit} node tests used`, { p: Math.min(1, (t?.node_tested ?? 0) / ss.candidates_limit) });
      } else {
        const rp = runProgress(p);
        set("runs", "done", "Recorded in the saved result");
        set("verdict", "done", "From the saved result");
        set("shrink", "live", `Confirming the failure first: run ${rp.runNo}/2`, { p: rp.frac });
      }
      set("export", "todo", "From the shrink result, when it finishes");
    } else {
      cur = "runs";
      const rp = runProgress(p);
      const b = rp.by[rp.runNo];
      set("runs", "live", b.cur === undefined ? `Run ${rp.runNo}/2 · fresh stack` : `Run ${rp.runNo}/2 · step ${Math.min(b.cur + 1, rp.total)}/${rp.total}`, { p: rp.frac });
      set("verdict", "todo", "Judged once both runs finish");
      set("shrink", "todo", "Only for a reproducible fail");
    }
  } else {
    cur = "verdict";
    const m = ui.view, f = resultFacts(m), v = f.v;
    const client = m.manifest?.node?.client_version || m.runs[0]?.meta?.ethrex?.client_version;
    set("target", f.na ? "warn" : "done", f.na ? `Not applicable: ${v.compatibility.target.eip8141}` : `${client ? `${clientShort(client)} · ` : ""}${v.rule_pack.id}`, { href: "#summary" });
    set("scenario", f.injected ? "warn" : "done", `${v.scenario.id} · ${v.sidecar_build.label}${f.injected ? " (injected regression)" : ""}`, { href: "#summary" });
    const toRuns = m.runs.length ? { href: "#stage-runs" } : null;
    if (!m.runs.length) set("runs", "skip", f.na ? "No node was started" : "Not run");
    else if (v.cancelled) set("runs", "warn", "Cancelled before the end", toRuns);
    else if ((v.disagreements || []).length) set("runs", "warn", "The two runs disagree", toRuns);
    else set("runs", "done", m.runs.map((r) => `run ${r.k} ${r.verdict ? word(r.verdict.overall).toLowerCase() : "no verdict"}`).join(" · "), toRuns);
    if (state === "pass") set("verdict", "pass", `Passed · ${f.reached}/${f.declared} assertions reached`, { href: "#summary" });
    else if (state === "fail") set("verdict", "fail", f.first ? `Failed · ${f.first.assertion_id} ${word(f.first.verdict).toLowerCase()}` : "Failed", { href: "#summary" });
    else set("verdict", "inc", `Inconclusive · ${plural(f.facts.length, "missing fact")}`, { href: "#summary" });
    const red = m.reduction;
    if (red) set("shrink", "done", red.reduced ? `${red.original.total} → ${red.reduced.total} steps` : "No smaller case found", { href: "#stage-shrink" });
    else if (state === "pass") set("shrink", "skip", "Not needed on a pass");
    else if (state === "inconclusive") set("shrink", "skip", "Only for a reproducible fail");
    else if (!f.reproducible) set("shrink", "skip", "Not reproducible, so not shrunk");
    else if (!f.canAct) set("shrink", "todo", ui.mode === "hosted" ? "Runs on your machine, from the downloaded bundle" : "Needs framelab serve");
    else set("shrink", "next", "Ready: shrink the failing case", { href: "#summary" });
    if (m.kind === "bundle") set("export", "done", m.compare ? "Bundle · fix compared" : "Bundle with replay.sh", { href: "#stage-export" });
    else if (state === "inconclusive") set("export", "skip", "Only a pass or a fail is exported");
    else if (f.canExport) set("export", S.shrink.status === "next" ? "open" : "next", "Ready: export a replayable bundle", { href: "#summary" });
    else if (!f.canAct) set("export", "todo", "Needs framelab serve");
    else set("export", "skip", "Negative-path and cancelled runs are not exported");
  }
  S[cur].current = true;
  return Object.values(S);
}

const GLYPH = { done: "check", pass: "check", fail: "x", inc: "question", warn: "alert", next: "arrow", open: "arrow", skip: "dash", todo: "circle" };
function processTrack(state) {
  const jump = (e) => {
    const target = document.querySelector(e.currentTarget.getAttribute("href"));

/** Arrow keys move the selection between cells of the matrix. */
function cellKeys(e) {
  const k = e.key;

  for (const el of document.querySelectorAll("table.timeline .cell")) {
    const x = { el, r: Number(el.dataset.r), c: Number(el.dataset.c) };
    const nearer = (b) => !b || Math.abs(x.r - r) < Math.abs(b.r - r) || (Math.abs(x.r - r) === Math.abs(b.r - r) && Math.abs(x.c - c) < Math.abs(b.c - c));
    if (k === "ArrowRight" && x.r === r && x.c > c && (!best || x.c < best.c)) best = x;
    if (k === "ArrowLeft" && x.r === r && x.c < c && (!best || x.c > best.c)) best = x;
    if (k === "ArrowDown" && x.r > r && nearer(best)) best = x;
    if (k === "ArrowUp" && x.r < r && nearer(best)) best = x;
  }
  if (!best) return;
  e.preventDefault();
  best.el.focus();
  best.el.click();
}

/** Run-level causes first, then per-assertion ones; a fact seen in several runs is listed once. */
function missingFacts(m) {
  const facts = [];
  for (const r of m.verdicts.compatibility?.applicable === false ? m.verdicts.compatibility.reasons : []) facts.push(`Not applicable: ${r}`);
  if (m.verdicts.not_run?.length) facts.push(`Not run: ${m.verdicts.not_run.join(", ")}`);
  const dis = m.verdicts.disagreements || [];
  if (m.verdicts.cancelled) {
    if (dis.length) facts.push(`The cancelled run stopped early, so the two runs cannot be compared (${dis.length} differences not listed).`);
  } else for (const d of dis) facts.push(`Runs disagree: ${d.length > 240 ? `${d.slice(0, 240)}…` : d}`);
  const byText = new Map();
  const note = (text, k) => { if (!byText.has(text)) byText.set(text, []); byText.get(text).push(k); };
  for (const r of m.runs) {
    if (r.verdict && r.verdict.counts.executed === 0) note("zero assertions executed", r.k);
    for (const p of r.evidence?.problems || []) note(`${p.kind}${p.checkpoint_id ? ` at ${p.checkpoint_id}` : ""}: ${p.detail}`, r.k);
  }
  for (const r of m.runs) for (const a of r.verdict?.assertions || []) if (a.verdict === "INCONCLUSIVE") for (const why of a.reasons) note(`${a.assertion_id}: ${why}`, r.k);
  for (const [text, runs] of byText) facts.push(`${runs.length > 1 ? `runs ${runs.join(", ")}` : `run ${runs[0]}`}: ${text}`);
  return facts;
}

    const cps = [...new Set(mism.map((a) => a.checkpoint_id))];
    const parts = mism.map((a) => `${a.tx_role} was expected ${a.expected} but observed ${a.observed}${cps.length > 1 ? ` at ${a.checkpoint_id}` : ""}`);
    sentence = mism.length ? `${parts.join("; ")}${cps.length === 1 ? ` at ${cps[0]}` : ""}. ${f.reproducible ? "Both runs agree." : "The two runs do not agree."}` : "See the two runs below.";
    const why = !f.reproducible ? "Not reproducible: the two runs do not agree on the mismatch, so it is not shrunk."
      : m.reduction ? "Already shrunk: the smallest case is below."
      : ui.mode === "hosted" ? "Shrinking needs a node, so it runs on your machine: download the bundle, then run framelab shrink on it."
      : !f.canAct ? "Start `framelab serve` to shrink from the UI." : null;
    body = [f.first?.reasons.some((r) => r.startsWith("wrong test expectation")) ? banner("grey", "Labelled a wrong test expectation: the fixture flips this expectation on purpose. Not a node bug.")
      : h("p", { class: "faint small" }, "A mismatch means the observed fate differs from the written expectation under the cited rule. On its own it does not show a node bug."),
      why ? h("p", { class: "muted small" }, why) : null];
    primary = [h("button", { class: "btn primary", disabled: Boolean(why) || ui.pending || ui.server?.job?.running, onclick: () => act("shrink", () => api("POST", "/api/shrink", { dir: m.dir })) }, icon("shrink"), "Shrink"), downloadBtn(false) || exportBtn(false)];
  } else {
    sentence = f.na ? "Not applicable to this target, so no node was started and nothing was judged." : `${plural(f.facts.length, "missing fact")}. An inconclusive result is never counted as green.`;
    body = [h("h4", null, "Missing facts"), h("ul", { class: "facts missing" }, f.facts.slice(0, 12).map((x) => h("li", null, x))), f.facts.length > 12 ? h("p", { class: "faint small" }, `${f.facts.length - 12} more in the raw evidence.`) : null];
    primary = h("button", { class: "btn primary", onclick: () => { ui.showRaw = !ui.showRaw; render(); if (ui.showRaw) document.getElementById("raw")?.scrollIntoView({ block: "start" }); } }, icon("eye"), ui.showRaw ? "Hide raw evidence" : "View raw evidence");
  }

  const tags = [
    f.injected ? injectedTag(f.injected.patch) : null,
    v.fault ? tag(`Negative-path test run: fault ${v.fault.kind}@${v.fault.checkpoint_id}`) : null,
    v.run2_sidecar_build ? tag(`Negative-path test run: run 2 used ${v.run2_sidecar_build.label}-${v.run2_sidecar_build.buildHash.slice(0, 12)}`) : null,
    isNegative({ scenario: v.scenario.id }) && !v.fault && !v.run2_sidecar_build ? tag("Negative test: built not to pass") : null,
    v.cancelled ? tag("Cancelled by the user") : null,
  ].filter(Boolean);
  const asList = as.length ? h("div", { class: "asserts", role: "list", "aria-label": `Assertions of run ${m.runs[0].k}` }, as.map((a) => {
    const t = toneOf(a.verdict);
    return h("div", { class: "as", role: "listitem" },
      h("span", { class: `tone-${t}` }, icon(TONE_ICON[t])),
      h("div", { class: "hd" }, h("span", { class: "id" }, a.assertion_id), h("span", { class: "kind", title: a.verdict }, word(a.verdict)), h("span", { class: "where" }, `${a.tx_role} · ${a.checkpoint_id}`)),
      t === "fail" ? h("dl", null, h("dt", null, "Expected"), h("dd", null, a.expected), h("dt", null, "Observed"), h("dd", { class: "obs" }, a.observed), h("dt", null, "Rule"), h("dd", null, a.rule_ref)) : null);
  })) : null;
  const dis = (v.disagreements || []).length;
  const runsRow = m.runs.length ? [h("div", { class: "runs" }, m.runs.map((r) => h("div", { class: "run" },
      h("div", { class: "rt" }, h("span", null, `Run ${r.k}/2`), r.verdict ? h("span", { class: "num" }, `${r.verdict.counts.executed}/${r.verdict.counts.declared} reached`) : null),
      r.verdict ? pill(r.verdict.overall) : h("span", { class: "faint" }, "no verdict")))),
    h("p", { class: "agree" }, dis ? "The two runs disagree." : m.runs.length === 2 ? "Both runs agree." : "Only one run was recorded.")] : null;
  const kindLabel = { run: "Run result", shrink: "Shrink result", bundle: "Exported bundle" }[m.kind] || m.kind;
  const tone = toneOf(v.overall);

  const summary = h("section", { class: `card summary s-${state}`, id: "summary" },
    cardHead(h("span", { class: "faint small" }, `Verdict · ${kindLabel}`),
      hostedBundle ? linkBtn() : null,
      h("button", { class: "btn ghost", "aria-label": "Close", "aria-keyshortcuts": "Escape", onclick: closeView }, icon("x"), "Close", h("kbd", { "aria-hidden": "true" }, "Esc"))),
    h("div", { class: "verdict" }, h("span", { class: `tone-${tone}` }, icon(TONE_ICON[tone])), h("span", { class: `word tone-${tone}` }, word(v.overall)),
      as.length ? h("span", { class: "of" }, `${passed}/${f.declared} passed`) : null),
    h("p", { class: "sentence" }, sentence),
    tags.length ? h("div", { class: "tags" }, tags) : null,
    f.na ? banner("grey", `Not applicable to this target (${v.compatibility.target.eip8141}). No node was started and no assertion was judged; this is not a conformance failure.`) : null,
    asList, body, runsRow,
    det("result-details", "Details",
      h("dl", { class: "kv" },
        kv("exit", v.exit_code, { mono: true }),
        kv("build", `${v.sidecar_build.label}-${v.sidecar_build.buildHash.slice(0, 12)}`, { mono: true, copy: v.sidecar_build.buildHash }),
        kv("rules", v.rule_pack.id, { mono: true }),
        kv("scenario", `${v.scenario.id} · ${v.scenario.hash.slice(0, 8)}`, { mono: true, copy: v.scenario.hash }),
        f.injected ? kv("inject", f.injected.patch, { mono: true }) : null,
        kv("folder", m.dir, { mono: true, copy: m.dir }))),
    h("div", { class: "actions" }, primary, toEvidence));

  const red = m.reduction;
  const dims = ["total", "setup", "action", "checkpoints", "actors", "expectations"];
  const reduction = red ? h("section", { class: "card", id: "stage-shrink" },
    cardHead(h("div", { class: "lead" }, h("h3", null, red.reduced ? "Smallest failing case found" : "Shrink"), h("span", { class: "faint small" }, `Frozen target, deletions only · stop: ${red.stop_reason}`))),
    red.reduced ? h("div", { class: "reduce-num" }, h("span", { class: "from" }, red.original.total), h("span", { class: "sr-only" }, " steps reduced to "), icon("arrow"), h("span", null, red.reduced.total), h("span", { class: "unit" }, "steps")) : null,
    h("p", { class: "claim" }, red.claim),
    h("p", { class: "target-line" }, h("span", { class: "faint" }, "Target, unchanged"), h("b", null, red.target.assertion_id), pill(red.target.verdict), h("span", { class: "mono faint" }, `${red.target.tx_role} · ${red.target.rule_ref} · ${red.target.checkpoint_id}`)),
    red.reduced ? h("div", { class: "table-wrap" }, h("table", { class: "plain" },
      h("thead", null, h("tr", null, h("th", null, ""), ["steps", "setup", "action", "checkpoints", "actors", "expectations"].map((k) => h("th", { class: "r" }, k)))),
      h("tbody", null, [["original", red.original], ["reduced", red.reduced]].map(([n, c]) => h("tr", { class: n }, h("th", null, n), dims.map((k) => h("td", { class: "r mono num" }, c[k]))))))) : h("p", null, "No smaller confirmed case."),
    red.reduced ? [h("h4", null, "Removed steps"), h("div", { class: "chips" }, red.reduced.removed_units.map((u) => h("span", { class: "chip removed" }, u))),
      red.reduced.removed_actors.length ? [h("h4", null, "Removed actors"), h("div", { class: "chips" }, red.reduced.removed_actors.map((u) => h("span", { class: "chip removed" }, u)))] : null] : null,
    red.pruned_expectations?.length ? h("p", { class: "muted" }, `Assertions removed from the reduced case because their preconditions no longer hold there: ${red.pruned_expectations.join(", ")}. No expected fate was edited.`) : null,
    red.final_confirmation ? [h("h4", null, "Final confirmation, two fresh runs"), h("ul", { class: "facts" }, red.final_confirmation.reasons.map((r) => h("li", null, r)))] : null,
    h("p", { class: "meta-line" }, `attempted ${red.totals.node_tested}, kept ${red.totals.kept}, unresolved ${red.totals.unresolved}, rejected before a node run ${red.totals.invalid}, cached ${red.totals.cached} · ${secs(red.budget.wall_used_ms)} of ${secs(red.budget.wall_limit_ms)}`),
    m.scenarioMin ? det("min-yaml", "scenario.min.yaml", h("pre", null, m.scenarioMin)) : null) : null;

  const man = m.manifest;
  const replay = hostedBundle ? `tar -xzf ${bundleName(m.dir)}.tar.gz && FRAMELAB=/path/to/framelab ${bundleName(m.dir)}/replay.sh` : `FRAMELAB=/path/to/framelab ${m.dir}/replay.sh`;
  const exported = m.kind === "bundle" || m.compare ? h("section", { class: "card", id: "stage-export" },
    cardHead(h("div", { class: "lead" }, h("h3", null, m.kind === "bundle" ? "Exported bundle" : "Fix comparison"), m.kind === "bundle" ? h("span", { class: "faint small" }, "Replays as a new execution on a clean local stack, not as playback of the saved events") : null)),
    m.kind === "bundle" ? [
      hostedBundle ? h("p", { class: "muted" }, "Download it, then replay it from a FrameLab checkout on your machine. replay.sh checks every file against SHA256SUMS and the pins before it starts a node.") : null,
      h("div", { class: "cmd" }, h("code", null, replay), copyBtn(replay, "replay command")),
      hostedBundle ? h("div", { class: "actions" }, downloadBtn(false)) : null,
      man ? h("dl", { class: "kv" },
        man.tool?.commit ? kv("made by", `${man.tool.name} ${man.tool.version} @ ${man.tool.commit.slice(0, 12)}${man.tool.dirty ? " (dirty tree)" : ""}`, { mono: true, copy: man.tool.commit }) : null,
        man.node?.client_version ? kv("node", man.node.client_version, { mono: true }) : null,
        man.reset?.method ? kv("reset", man.reset.method) : null,
        man.files ? kv("files", `${Object.keys(man.files).length} listed with their sha256; replay refuses to run if any differs`) : null,
        man.sanitized?.length ? kv("sanitized", man.sanitized.join(" · ")) : null,
        man.public_test_keys ? kv("test keys", man.public_test_keys) : null) : null] : null,
    m.compare ? [m.kind === "bundle" ? h("h4", null, "Fix comparison") : null,
      h("p", { class: "muted" }, `${m.compare.scope}: old build ${m.compare.old_build.label}-${m.compare.old_build.buildHash.slice(0, 12)} → new build ${m.compare.new_build.label}-${m.compare.new_build.buildHash.slice(0, 12)}. Expectations were not changed.`),
      h("div", { class: "table-wrap" }, h("table", { class: "plain" },
        h("thead", null, h("tr", null, h("th", null, "assertion"), h("th", null, "before"), h("th", null, ""), h("th", null, "after"), h("th", null, "change"))),
        h("tbody", null, m.compare.rows.map((r) => h("tr", null, h("th", { class: "mono" }, r.assertion_id), h("td", { class: "mono" }, r.before), h("td", { "aria-label": "becomes" }, icon("arrow")), h("td", { class: "mono" }, r.after), h("td", null, r.change))))))] : null) : null;

  const raw = ui.showRaw ? h("section", { class: "card", id: "raw" }, h("h3", null, "Raw evidence"),
    m.runs.map((r) => det(`raw-evidence-${r.k}`, `run ${r.k}: evidence.json`, h("pre", null, pretty(r.evidence))))) : null;

  return [summary, timeline(), reduction, exported, raw];
}

// ---------- render loop ----------
let pointerDown = false, deferredRender = false, enterTimer = null;
document.addEventListener("pointerdown", () => { pointerDown = true; }, true);
document.addEventListener("pointerup", () => { pointerDown = false; if (deferredRender) { deferredRender = false; setTimeout(render, 0); } }, true);
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || !ui.view || e.defaultPrevented || e.target.closest?.("select, input, textarea")) return;
  closeView();
});
const focusKey = (el) => el && el !== document.body ? `${el.tagName}|${el.id || el.getAttribute("aria-label") || el.textContent.trim().slice(0, 80)}` : null;

document.addEventListener("click", (e) => { const p = document.getElementById("states"); if (p.open && !p.contains(e.target)) p.open = false; });
document.addEventListener("keydown", (e) => {
  const p = document.getElementById("states");
  if (e.key === "Escape" && p.open) { p.open = false; p.querySelector("summary")?.focus(); e.preventDefault(); }
}, true);

function render() {
  // Replacing the element between pointerdown and pointerup would swallow the click.
  if (pointerDown) { deferredRender = true; return; }
  const hadFocus = focusKey(document.activeElement);
  const state = currentState();
  renderTop(state);
  const app = document.getElementById("app");
  const track = document.getElementById("track");
  let content;
  try {
    if (state === "running") content = viewRunning();
    else if (state === "shrinking") content = viewShrinking();
    else if (state === "pass" || state === "fail" || state === "inconclusive") content = viewResult(state);
    else if (state === "ready") content = viewReady();
    else content = viewEmpty();
    track.replaceChildren(processTrack(state));
  } catch (err) {
    content = [h("section", { class: "card" }, banner("red", `This view could not be drawn: ${err.message}. The files on disk are unchanged.`),
      ui.view ? h("button", { class: "btn", onclick: closeView }, icon("x"), "Close") : null)];
  }
  app.replaceChildren(...[noticeBar(), ui.error ? h("div", { class: "banner red", role: "alert" }, icon("alert"), h("div", null, ui.error), h("button", { class: "linkish", onclick: () => poll(true) }, "Retry")) : null, ...content].filter(Boolean));
  // Entrance motion only when the view itself changes; poll re-renders stay still.
  const key = `${state}|${ui.view?.dir || ""}`;
  if (key !== ui.lastKey) {
    // A new view starts at its summary, not wherever the saved-results list was scrolled to.
    if (ui.lastKey) window.scrollTo({ top: 0 });
    ui.lastKey = key;
    app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter");
    clearTimeout(enterTimer); enterTimer = setTimeout(() => app.classList.remove("enter"), 600);
  }
  // On narrow screens the stage list scrolls sideways: keep the current stage in view (the list only, never the page).
  const tc = track.querySelector("[aria-current]");
  if (tc && track.scrollWidth > track.clientWidth) track.scrollLeft = Math.max(0, tc.offsetLeft - (track.clientWidth - tc.offsetWidth) / 2);
  const sw = app.querySelector(".steps-wrap"), live = sw?.querySelector(".rs-live");
  if (live && sw.scrollWidth > sw.clientWidth) sw.scrollLeft = Math.max(0, live.getBoundingClientRect().right - sw.getBoundingClientRect().right + sw.scrollLeft + 16);
  for (const pre of app.querySelectorAll("pre[data-joblog], pre[data-envlog]")) pre.scrollTop = pre.scrollHeight;
  // On open (and on a run switch) bring the selected cell into the matrix viewport, right of the sticky role column.
  if (ui.scrollSel) {
    ui.scrollSel = false;
    const cell = app.querySelector("table.timeline .cell[aria-pressed='true']");
    const wrap = cell?.closest(".grid-wrap");
    if (wrap) {
      const stick = wrap.querySelector("tbody th")?.offsetWidth ?? 0;
      const cr = cell.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
      const visible = wr.width - stick;
      wrap.scrollLeft = Math.max(0, wrap.scrollLeft + (cr.left - wr.left) - stick - Math.max(16, (visible - cr.width) / 2));
    }
  }
  if (hadFocus) [...document.querySelectorAll("#app button, #app select, #app a, #app summary, #app input, #app label[tabindex], #track a")].find((el) => focusKey(el) === hadFocus)?.focus({ preventScroll: true });
}

let timer = null;
async function poll(once) {
  clearTimeout(timer);
  if (ui.mode === "file") { render(); return; }
  let changed = once;
  try {
    const s = await api("GET", "/api/state");
    if (s.mode === "hosted") ui.mode = "hosted";
    const sig = JSON.stringify({ ...s, job: s.job ? { ...s.job, log: undefined } : null });
    const pre = document.querySelector("pre[data-joblog]");
    if (pre && s.job) {
      const atEnd = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 24;
      pre.textContent = s.job.log.join("\n") || "…";
      if (atEnd) pre.scrollTop = pre.scrollHeight;
    }
    changed = changed || sig !== ui.lastSig || Boolean(ui.error);
    ui.lastSig = sig; ui.server = s; ui.error = null;
    if (s.env?.info) ui.lastEnv = s.env.info;
    const job = s.job;
    if (job?.running) { ui.watching = job.dir; ui.view = null; }
    else if (job && ui.watching === job.dir) { ui.watching = null; await openDir(job.dir); }
    if (!ui.booted) {
      ui.booted = true;
      const b = new URLSearchParams(location.search).get("b");
      if (b && !job?.running) { await openDir(b); changed = true; }
    }
  } catch (err) {
    if (!ui.server) { ui.mode = "file"; render(); return; }
    ui.error = `Lost contact with the FrameLab server: ${err.message}`;
    changed = true;
  }
  const fast = ui.server?.job?.running || ui.server?.env?.status === "starting";
  // Re-render only on change: a rebuilt button under the pointer loses the click, and forms, scroll and open sections must survive polling.
  if (changed) render();
  // The hosted copy only changes when a bundle is published.
  timer = setTimeout(() => poll(false), ui.mode === "hosted" ? 60000 : fast ? 1000 : 4000);
}
setInterval(() => {
  const now = Date.now();
  for (const el of document.querySelectorAll("[data-since]")) el.textContent = mmss(now - Number(el.dataset.since));
  for (const el of document.querySelectorAll("[data-secs]")) el.textContent = wsecs(now - Number(el.dataset.secs));
  for (const el of document.querySelectorAll("[data-until]")) el.textContent = mmss(Number(el.dataset.until) - now);
  for (const el of document.querySelectorAll("[data-meter-from]")) el.style.setProperty("--p", Math.min(1, Math.max(0, (now - Number(el.dataset.meterFrom)) / Number(el.dataset.meterLen))).toFixed(4));
}, 1000);

if (location.protocol === "file:") { ui.mode = "file"; render(); } else poll(true);
</script>
